<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; connect-src * 'unsafe-inline'; img-src * data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InspecTech - Mapeo con Fotos, CSV y PDF</title>
    <!-- html2pdf.js para exportación directa a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #1e293b;
            --primary-accent: #0284c7;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;eb
            --border: #334155;
            
            --sev-baja: #22c55e;
            --sev-media: #f59e0b;
            --sev-alta: #ef4444;
            --sev-critica: #7f1d1d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f172a; color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            background-color: #1e293b;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 32px; height: 32px; background: #0284c7; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .brand-title { font-size: 18px; font-weight: 700; }
        .brand-subtitle { font-size: 12px; color: var(--text-muted); }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .btn {
            background: #334155; color: #fff; border: none; padding: 8px 12px; border-radius: 6px;
            cursor: pointer; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .btn:hover { background: #475569; }
        .btn-primary { background: var(--primary-accent); }
        .btn-primary:hover { background: #0369a1; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }

        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        .viewport {
            flex: 1; background-color: #090d16; position: relative; overflow: auto; cursor: crosshair;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .map-wrapper { position: relative; user-select: none; display: inline-block; max-width: 100%; }
        #planImage { max-width: 100%; height: auto; display: block; border-radius: 4px; border: 1px solid var(--border); }

        .placeholder-text { position: absolute; text-align: center; color: var(--text-muted); pointer-events: none; }

        .marker {
            position: absolute; width: 28px; height: 28px; border-radius: 50%; transform: translate(-50%, -50%);
            border: 2px solid #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: #ffffff;
            transition: transform 0.2s; z-index: 5;
        }
        .marker:hover { transform: translate(-50%, -50%) scale(1.3); z-index: 10; }
        .marker.sev-Baja { background-color: var(--sev-baja); }
        .marker.sev-Media { background-color: var(--sev-media); }
        .marker.sev-Alta { background-color: var(--sev-alta); }
        .marker.sev-Critica { background-color: var(--sev-critica); }

        .sidebar { width: 380px; background-color: var(--bg-card); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .anomaly-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

        .anomaly-card {
            background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
        }
        .anomaly-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .anomaly-title { font-weight: 600; font-size: 14px; color: #fff; }

        .card-photo-preview {
            width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-top: 8px; border: 1px solid var(--border);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7);
            display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { background: #1e293b; border: 1px solid var(--border); width: 460px; max-width: 90%; border-radius: 12px; padding: 20px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .form-control { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 13px; }

        .photo-upload-box {
            border: 2px dashed var(--border); padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; background: #0f172a;
        }
        .photo-preview-img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 6px; margin-top: 8px; display: none; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px; }

        /* Plantilla oculta para renderizar e imprimir PDF en alta calidad */
        #pdfReportTemplate {
            display: none; background: #ffffff; color: #1e293b; padding: 30px; font-family: Arial, sans-serif;
        }
        #pdfReportTemplate h1 { font-size: 20px; border-bottom: 2px solid #0284c7; padding-bottom: 8px; margin-bottom: 15px; color: #0f172a; }
        #pdfReportTemplate table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        #pdfReportTemplate th, #pdfReportTemplate td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        #pdfReportTemplate th { background: #f1f5f9; color: #0f172a; font-weight: bold; }
        .pdf-photo { max-width: 120px; max-height: 80px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">I</div>
            <div>
                <div class="brand-title">InspecTech</div>
                <div class="brand-subtitle">Mapeo de Anomalías con Fotografías</div>
            </div>
        </div>
        <div class="header-actions">
            <label class="btn btn-primary" for="imageInput">📁 Cargar Plano</label>
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/jpg, image/*" style="display: none;">
            <button class="btn btn-success" onclick="exportCSV()">📊 Exportar Excel (CSV)</button>
            <button class="btn btn-danger" onclick="exportPDF()">📄 Exportar PDF</button>
        </div>
    </header>

    <div class="main-container">
        <div class="viewport" id="viewport">
            <div class="placeholder-text" id="placeholderText">
                <h2>Carga una imagen de tu plano para comenzar</h2>
            </div>
            <div class="map-wrapper" id="mapWrapper" style="display: none;">
                <img id="planImage" src="" alt="Plano">
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title" style="font-weight: bold;">Anomalías Registradas (<span id="anomalyCount">0</span>)</div>
            </div>
            <div class="anomaly-list" id="anomalyList">
                <div class="empty-state">No hay anomalías marcadas.</div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle" style="font-weight: bold; margin-bottom: 12px;">Nueva Anomalía</div>
            
            <input type="hidden" id="coordX">
            <input type="hidden" id="coordY">

            <div class="form-group">
                <label>Título / Falla *</label>
                <input type="text" id="inputTitle" class="form-control" placeholder="Ej: Humedad en pared">
            </div>

            <div class="form-group">
                <label>Gravedad *</label>
                <select id="inputSeverity" class="form-control">
                    <option value="Baja">🟢 Baja</option>
                    <option value="Media">🟡 Media</option>
                    <option value="Alta">🔴 Alta</option>
                    <option value="Critica">🚨 Crítica</option>
                </select>
            </div>

            <div class="form-group">
                <label>Sector</label>
                <input type="text" id="inputSector" class="form-control" placeholder="Ej: Pasillo principal">
            </div>

            <div class="form-group">
                <label>Fotografía de la Falla</label>
                <div class="photo-upload-box" onclick="document.getElementById('cameraInput').click()">
                    <span>📸 Tomar Foto o Seleccionar</span>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handlePhotoUpload(event)">
                    <img id="photoPreview" class="photo-preview-img" src="" alt="Vista previa">
                </div>
            </div>

            <div class="modal-buttons" style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveAnomaly()">Guardar Punto</button>
            </div>
        </div>
    </div>

    <!-- Elemento auxiliar oculto para generar el reporte PDF -->
    <div id="pdfReportTemplate"></div>

    <script>
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyWiUfUxKJVCB5hgyZdzNDrlSjDTvI6BKUeQzazh8c88BO-SBpB0FlZvcnLqFrvb1FQ/exec";

        let anomalies = [];
        let currentPhotoBase64 = "";

        const imageInput = document.getElementById('imageInput');
        const planImage = document.getElementById('planImage');
        const mapWrapper = document.getElementById('mapWrapper');
        const placeholderText = document.getElementById('placeholderText');
        const modalOverlay = document.getElementById('modalOverlay');

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    planImage.onload = function() {
                        placeholderText.style.display = 'none';
                        mapWrapper.style.display = 'inline-block';
                    };
                    planImage.onerror = function() {
                        alert("Error al cargar la imagen. Asegúrate de seleccionar una imagen válida.");
                    };
                    planImage.src = evt.target.result;
                };
                reader.onerror = function() {
                    alert("No se pudo leer el archivo seleccionado.");
                };
                reader.readAsDataURL(file);
            }
        });

        planImage.addEventListener('click', function(e) {
            const rect = planImage.getBoundingClientRect();
            const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
            const yPercent = ((e.clientY - rect.top) / rect.height) * 100;

            openModalForNew(xPercent.toFixed(2), yPercent.toFixed(2));
        });

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentPhotoBase64 = e.target.result;
                    const img = document.getElementById('photoPreview');
                    img.src = currentPhotoBase64;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function openModalForNew(x, y) {
            document.getElementById('modalTitle').innerText = 'Nueva Anomalía';
            document.getElementById('coordX').value = x;
            document.getElementById('coordY').value = y;
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputSector').value = '';
            currentPhotoBase64 = "";
            document.getElementById('photoPreview').style.display = 'none';
            modalOverlay.classList.add('active');
        }

        function closeModal() { modalOverlay.classList.remove('active'); }

        function saveAnomaly() {
            const title = document.getElementById('inputTitle').value.trim();
            const severity = document.getElementById('inputSeverity').value;
            const sector = document.getElementById('inputSector').value.trim();
            const x = parseFloat(document.getElementById('coordX').value);
            const y = parseFloat(document.getElementById('coordY').value);

            if (!title) { alert('Ingresa un título.'); return; }

            const newAnomaly = {
                id: Date.now(),
                num: anomalies.length + 1,
                title, severity, sector, x, y,
                photo: currentPhotoBase64,
                date: new Date().toLocaleDateString()
            };
            
            anomalies.push(newAnomaly);

            // Enviar a Google Sheets
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newAnomaly)
            });

            closeModal();
            renderMarkers();
            renderList();
        }

        function renderMarkers() {
            document.querySelectorAll('.marker').forEach(m => m.remove());
            anomalies.forEach((item) => {
                const marker = document.createElement('div');
                marker.className = `marker sev-${item.severity}`;
                marker.style.left = `${item.x}%`;
                marker.style.top = `${item.y}%`;
                marker.innerText = item.num;
                marker.onclick = () => alert(`Anomalía #${item.num}: ${item.title}`);
                mapWrapper.appendChild(marker);
            });
        }

        function renderList() {
            const listContainer = document.getElementById('anomalyList');
            document.getElementById('anomalyCount').innerText = anomalies.length;

            if (anomalies.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No hay anomalías marcadas.</div>';
                return;
            }

            listContainer.innerHTML = '';
            anomalies.forEach(item => {
                const card = document.createElement('div');
                card.className = 'anomaly-card';
                card.innerHTML = `
                    <div class="anomaly-card-header">
                        <div class="anomaly-title">#${item.num} ${item.title}</div>
                        <span style="font-size:11px; font-weight:bold;">${item.severity}</span>
                    </div>
                    <div style="font-size:12px; color:#94a3b8;">📍 ${item.sector || 'Sin sector'}</div>
                    ${item.photo ? `<img src="${item.photo}" class="card-photo-preview">` : ''}
                `;
                listContainer.appendChild(card);
            });
        }

        // --- FUNCIONALIDAD DE EXPORTACIÓN CSV CORREGIDA ---
        function exportCSV() {
            if (anomalies.length === 0) {
                alert("No hay anomalías registradas para exportar.");
                return;
            }

            // Encabezado con BOM (﻿) para UTF-8 y delimitador de punto y coma ';'
            let csvContent = "\uFEFFAnomalia_ID;Numero;Titulo;Gravedad;Sector;Posicion_X;Posicion_Y;Fecha\n";
            
            anomalies.forEach(a => {
                let row = `"${a.id}";"${a.num}";"${a.title}";"${a.severity}";"${a.sector || ''}";"${a.x}";"${a.y}";"${a.date}"`;
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", `InspecTech_Anomalias_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- FUNCIONALIDAD DE EXPORTACIÓN PDF ---
        function exportPDF() {
            if (anomalies.length === 0) {
                alert("No hay anomalías registradas para generar el informe PDF.");
                return;
            }

            const reportContainer = document.getElementById('pdfReportTemplate');
            
            let tableRows = '';
            anomalies.forEach(a => {
                tableRows += `
                    <tr>
                        <td style="text-align:center; font-weight:bold;">#${a.num}</td>
                        <td><strong>${a.title}</strong></td>
                        <td>${a.severity}</td>
                        <td>${a.sector || 'N/A'}</td>
                        <td>${a.x}% , ${a.y}%</td>
                        <td style="text-align:center;">
                            ${a.photo ? `<img src="${a.photo}" class="pdf-photo">` : '<em>Sin foto</em>'}
                        </td>
                    </tr>
                `;
            });

            reportContainer.innerHTML = `
                <h1>InspecTech - Informe de Inspección Técnicas</h1>
                <p><strong>Fecha de reporte:</strong> ${new Date().toLocaleDateString()}</p>
                <p><strong>Total de anomalías detectadas:</strong> ${anomalies.length}</p>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Falla / Anomalía</th>
                            <th>Gravedad</th>
                            <th>Sector</th>
                            <th>Coordenadas (X, Y)</th>
                            <th>Foto Registrada</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            `;

            reportContainer.style.display = 'block';

            const opt = {
                margin:       10,
                filename:     `Informe_InspecTech_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(reportContainer).save().then(() => {
                reportContainer.style.display = 'none';
            });
        }
    </script>
</body>
</html>
